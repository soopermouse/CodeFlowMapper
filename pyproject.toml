[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "code-flow-mapper"
version = "1.0.0"
description = "Maps a legacy codebase (source, photos of the code, SonarQube exports) into an as-is archive of flows, cover sheets, trackers and tooling."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Simona Diana Thrussell PhD" }]
dependencies = ["reportlab>=4.0", "openpyxl>=3.1", "Flask>=3.0", "PyYAML>=6.0", "Pillow>=10.0"]

[project.optional-dependencies]
server = ["waitress>=3.0"]

[project.scripts]
codemapper = "codemapper.cli:main"

[tool.setuptools.packages.find]
include = ["codemapper*"]

[tool.setuptools.package-data]
codemapper = ["web/templates/*.html", "web/static/*"]
